<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs — BCE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content">
      
      <div class="page-header">
        <h1>Audit Logs</h1>
        <p>Track all actions performed by administrators.</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Admin</th>
              <th>Action</th>
              <th>Target</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="4" style="text-align: center; padding: 30px;">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
(async () => {
  const admin = await ADMIN_LAYOUT.init('System / Audit Logs');
  if (!admin) return;

  try {
    const res = await ADMIN_API.get('admin.getAuditLogs');
    const tbody = document.getElementById('logsBody');
    
    if (res.success && res.data.length > 0) {
      tbody.innerHTML = res.data.map(l => {
        const d = new Date(l.CreatedAt);
        const time = isNaN(d) ? '-' : d.toLocaleString('en-IN');
        return `
          <tr>
            <td style="font-size: 12px; color: var(--text-muted);">${time}</td>
            <td><strong>${l.AdminEmail || 'System'}</strong></td>
            <td><span class="badge badge-upcoming">${l.Action}</span></td>
            <td>${l.TargetType} (${l.TargetID || '-'})<br><small>${l.Details || ''}</small></td>
          </tr>
        `;
      }).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No logs found.</td></tr>';
    }
  } catch (e) {
    document.getElementById('logsBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Error loading logs.</td></tr>';
  }
})();
</script>
</body>
</html>
