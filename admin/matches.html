<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Schedule — BCE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content">
      
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;">
        <div>
          <h1>Match Schedule</h1>
          <p>Create and manage upcoming matches.</p>
        </div>
        <button onclick="openMatchModal()" class="btn btn-primary">＋ Schedule Match</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Match ID</th>
              <th>Tournament</th>
              <th>Round</th>
              <th>Scheduled Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="matchesBody">
            <tr><td colspan="5" style="text-align: center; padding: 30px;">Loading matches...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- Create Match Modal -->
<div id="matchModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Schedule New Match</h3>
      <button class="modal-close" onclick="document.getElementById('matchModal').classList.remove('open')">&times;</button>
    </div>
    <form id="matchForm" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label class="form-label">Select Tournament *</label>
        <select id="mTournament" class="form-select" required>
          <option value="">Select...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Round Name (e.g. Quarter Final)</label>
        <input type="text" id="mRound" class="form-input" required placeholder="Match 1">
      </div>
      <div class="form-group">
        <label class="form-label">Date & Time</label>
        <input type="datetime-local" id="mTime" class="form-input" required>
      </div>
      <button type="submit" id="mSaveBtn" class="btn btn-primary">Schedule Match</button>
    </form>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
(async () => {
  const admin = await ADMIN_LAYOUT.init('Matches');
  if (!admin) return;

  let allMatches = [];
  let tournamentsCache = {};

  function badge(s) {
    s = String(s || 'upcoming').toLowerCase();
    return `<span class="badge badge-${s}">${s}</span>`;
  }

  function formatDate(iso) {
    if (!iso) return 'TBA';
    const d = new Date(iso);
    return isNaN(d) ? 'TBA' : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function loadData() {
    try {
      const [mRes, tRes] = await Promise.all([
        ADMIN_API.get('admin.getMatches'),
        ADMIN_API.get('getTournaments')
      ]);

      if (tRes.success) {
        const sel = document.getElementById('mTournament');
        (tRes.data || []).forEach(t => {
          tournamentsCache[t.TournamentID] = t.Name;
          sel.innerHTML += `<option value="${t.TournamentID}">${t.Name}</option>`;
        });
      }

      if (mRes.success) {
        allMatches = mRes.data || [];
        allMatches.sort((a, b) => new Date(a.ScheduledAt || 0) - new Date(b.ScheduledAt || 0));
        
        const tbody = document.getElementById('matchesBody');
        if (allMatches.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">No matches scheduled.</td></tr>';
          return;
        }

        tbody.innerHTML = allMatches.map(m => `
          <tr>
            <td><strong style="color:#fff;">${m.MatchID}</strong></td>
            <td>${tournamentsCache[m.TournamentID] || m.TournamentID}</td>
            <td>${m.Round || '-'}</td>
            <td>${formatDate(m.ScheduledAt)}</td>
            <td>${badge(m.Status)}</td>
          </tr>
        `).join('');
      }
    } catch (e) { console.error(e); }
  }

  loadData();

  window.openMatchModal = () => document.getElementById('matchModal').classList.add('open');

  document.getElementById('matchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('mSaveBtn');
    btn.disabled = true;

    const data = {
      TournamentID: document.getElementById('mTournament').value,
      Round: document.getElementById('mRound').value,
      ScheduledAt: document.getElementById('mTime').value,
      Status: 'upcoming'
    };

    try {
      const res = await ADMIN_API.post('admin.createMatch', { data });
      if (res.success) window.location.reload();
      else alert(res.message);
    } catch (err) { alert('Error'); }
    finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
