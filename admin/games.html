<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — BCE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content">
      
      <div class="page-header">
        <h1>Games Management</h1>
        <p>Add games like Free Fire, BGMI, Valorant, etc.</p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px; align-items: start;">
        
        <div class="dashboard-card">
          <h2 style="margin-bottom: 16px;">Add New Game</h2>
          <form id="gameForm" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Game Name *</label>
              <input type="text" id="gName" class="form-input" required placeholder="e.g. BGMI">
            </div>
            <div class="form-group">
              <label class="form-label">Game Code *</label>
              <input type="text" id="gCode" class="form-input" required placeholder="e.g. BGMI">
            </div>
            <div class="form-group">
              <label class="form-label">Team Size</label>
              <input type="number" id="gTeamSize" class="form-input" value="4" required>
            </div>
            <button type="submit" id="addBtn" class="btn btn-primary">Add Game</button>
          </form>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Game Name</th>
                <th>Code</th>
                <th>Team Size</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="gamesBody"><tr><td colspan="4" style="text-align:center;padding:30px;">Loading...</td></tr></tbody>
          </table>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
(async () => {
  const admin = await ADMIN_LAYOUT.init('Games');
  if (!admin) return;

  async function loadGames() {
    try {
      const r = await ADMIN_API.get('getGames');
      const tbody = document.getElementById('gamesBody');
      if (r.success && r.data && r.data.length) {
        tbody.innerHTML = r.data.map(g => {
          const name = g.Name || g.GameName || g.Title || g.Code || 'Unknown';
          const code = g.GameID || g.Code || '-';
          const size = g.DefaultTeamSize || g.TeamSize || 4;
          return `<tr>
            <td><strong style="color:#fff; font-size: 15px;">${name}</strong></td>
            <td><span class="badge" style="background:var(--bg-secondary);border:1px solid var(--border);color:#fff;">${code}</span></td>
            <td>${size} Players</td>
            <td><span class="badge badge-active">Active</span></td>
          </tr>`;
        }).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;">No games found. Add one!</td></tr>';
      }
    } catch(e) {
      document.getElementById('gamesBody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#f87171;">Error loading</td></tr>';
    }
  }

  loadGames();

  document.getElementById('gameForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addBtn');
    btn.disabled = true; btn.textContent = 'Adding...';
    
    try {
      const r = await ADMIN_API.post('admin.createGame', { data: {
        Name: document.getElementById('gName').value.trim(),
        GameID: document.getElementById('gCode').value.trim().toUpperCase(),
        DefaultTeamSize: Number(document.getElementById('gTeamSize').value),
        IsActive: 'TRUE' 
      }});
      if (r.success) {
        document.getElementById('gameForm').reset();
        loadGames();
      } else alert(r.message);
    } catch(err) { alert('Error: ' + err.message); }
    finally { btn.disabled = false; btn.textContent = 'Add Game'; }
  });
})();
</script>
</body>
</html>
