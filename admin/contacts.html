<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts — BCE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content">
      
      <div class="page-header">
        <h1>Contact Messages</h1>
        <p>Read and manage messages from the public contact form.</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Subject</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="contactsBody">
            <tr><td colspan="5" style="text-align: center; padding: 30px;">Loading messages...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- View Modal -->
<div id="msgModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Message Details</h3>
      <button class="modal-close" onclick="document.getElementById('msgModal').classList.remove('open')">&times;</button>
    </div>
    <div style="margin-bottom: 16px;">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">From:</div>
      <div id="msgFrom" style="font-weight: 600; color: #fff;"></div>
    </div>
    <div style="margin-bottom: 16px;">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Subject:</div>
      <div id="msgSubject" style="font-weight: 600; color: #fff;"></div>
    </div>
    <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-secondary); border-radius: 6px; line-height: 1.6; white-space: pre-wrap;" id="msgBody"></div>
    
    <div style="display: flex; gap: 10px;">
      <button onclick="markResolved()" class="btn btn-success" style="flex: 1;">Mark as Resolved</button>
    </div>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
(async () => {
  const admin = await ADMIN_LAYOUT.init('Contacts');
  if (!admin) return;

  let allMsgs = [];
  let currentMsgId = '';

  async function loadData() {
    try {
      const res = await ADMIN_API.get('admin.getContacts');
      if (res.success) {
        allMsgs = res.data || [];
        allMsgs.sort((a, b) => new Date(b.SubmittedAt || 0) - new Date(a.SubmittedAt || 0));
        render();
      }
    } catch (e) { console.error(e); }
  }

  function render() {
    const tbody = document.getElementById('contactsBody');
    if (allMsgs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">No messages found.</td></tr>';
      return;
    }

    tbody.innerHTML = allMsgs.map(m => {
      const isPending = String(m.Status).toLowerCase() === 'pending';
      const date = m.SubmittedAt ? new Date(m.SubmittedAt).toLocaleDateString('en-IN') : '-';
      
      return `
        <tr style="${isPending ? 'background: rgba(225,6,0,0.05);' : ''}">
          <td><strong style="color:#fff;">${m.Name || 'Unknown'}</strong><br><small style="color:var(--text-muted);">${m.Email}</small></td>
          <td>${m.Subject || '-'}</td>
          <td>${date}</td>
          <td><span class="badge badge-${isPending ? 'pending' : 'completed'}">${m.Status || 'Pending'}</span></td>
          <td>
            <button onclick='viewMsg(${JSON.stringify(m).replace(/'/g, "&#39;")})' class="btn btn-outline btn-sm">View Message</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  loadData();

  window.viewMsg = (m) => {
    currentMsgId = m.ContactID;
    document.getElementById('msgFrom').innerHTML = `${m.Name} (<a href="mailto:${m.Email}" style="color:var(--red);">${m.Email}</a>)<br><small style="color:var(--text-muted);">${m.Phone || ''}</small>`;
    document.getElementById('msgSubject').textContent = m.Subject || 'No Subject';
    document.getElementById('msgBody').textContent = m.Message || '';
    document.getElementById('msgModal').classList.add('open');
  };

  window.markResolved = async () => {
    if (!currentMsgId) return;
    try {
      const res = await ADMIN_API.post('admin.updateContact', { contactId: currentMsgId, status: 'Resolved' });
      if (res.success) {
        document.getElementById('msgModal').classList.remove('open');
        loadData();
      } else alert(res.message);
    } catch (e) { alert('Error'); }
  };
})();
</script>
</body>
</html>
